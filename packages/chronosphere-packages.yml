provider: Chronosphere
providerId: chronosphere
summary:
  official_count: 9
  finding: >-
    Chronosphere publishes no first-party REST client library for the Config, Data or State API in
    any language registry. Its shipped client surface is infrastructure-as-code and CLI: a
    Terraform provider, a Pulumi provider in four languages, a Go MCP server and the Chronoctl
    binary. A developer calling the HTTP API writes their own client.
  currency: >-
    The Terraform provider (2026-08-25) and Chronoctl (2026-08-20) are actively released. The
    Pulumi provider's language SDKs have drifted apart from each other and from the provider: the
    NuGet package last published 2024-07-02 and the npm package 2025-10-23, while the Go/PyPI
    SDKs track 0.9.16 from mid-2026.
