        schema:
          items:
            type: string
          type: array
      - description: Filters results by collection_slug, where any Dashboard with a matching collection_slug in the given list (and matches all other filters) will be returned.
        in: query
        name: collection_slugs
        schema:
          items:
            type: string
          type: array
      - description: Filters results by name, where any Dashboard with a matching name in the given list (and matches all other filters) will be returned.
        in: query
        name: names
        schema:
          items:
            type: string
          type: array
      - description: 'Optional. Flag to populate the `dashboard_json` field of the returned

          dashboards. By default, `dashboard_json` is empty.'
        in: query
        name: include_dashboard_json
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/configv1ListDashboardsResponse'
          description: A successful response.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError_2'
          description: An unexpected error response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/genericError'
          description: An undefined error response.
      tags:
      - Dashboard
      security:
      - ApiKeyAuth: []
      summary: List dashboards
      x-summary-source: derived
    post:
      operationId: CreateDashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/configv1CreateDashboardRequest'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/configv1CreateDashboardResponse'
          description: A successful response containing the created Dashboard.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError_2'
          description: Cannot create the Dashboard because the request is invalid.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError_2'
          description: Cannot create the Dashboard because there is a conflict with an existing Dashboard.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError_2'
          description: An unexpected error response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/genericError'
          description: An undefined error response.
      tags:
      - Dashboard
      security:
      - ApiKeyAuth: []
      summary: Create dashboard
      x-summary-source: derived
    servers:
    - url: https://{tenant}.chronosphere.io
      variables:
        tenant:
          default: tenant
          description: tenant ID assigned by the service provider
