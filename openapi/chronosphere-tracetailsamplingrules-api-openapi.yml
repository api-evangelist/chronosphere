      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/configunstableCreateTraceTailSamplingRulesRequest'
        required: true
      summary: Create trace tail sampling rules
      x-summary-source: derived
    put:
      operationId: UpdateTraceTailSamplingRules
      responses:
        '200':
          description: A successful response containing the updated TraceTailSamplingRules.
          content:
            application/json:
              schema:
