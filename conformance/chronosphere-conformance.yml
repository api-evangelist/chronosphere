  source:
  - https://trust.chronosphere.io/
  - https://chronosphere.io/security-overview/
  certifications:
  - SOC 2 Type 2
  - ISO 27001
  - ISO 27017
  - ISO 27018
  gating: >-
    "Chronosphere is SOC 2 Type 2 and ISO 27001 audited. To request our report, please reach out
    to your assigned account manager." Vulnerability assessments are also available on request.
    The certifications are named publicly; the reports are account-gated.
  details: security/chronosphere-trust-center.yml
