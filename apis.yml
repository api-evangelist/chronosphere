  - pricing
  generated: '2026-08-29'
  method: derived
accessModel:
  pricing: enterprise
  onboarding: sales-gated
  trial: false
  try_now: false
  public: false
  label: Enterprise · Sales-gated onboarding
  confidence: high
  source:
  - plans
  generated: '2026-08-29'
  method: searched
  note: 'Corrects a derived value of "Paid · Self-serve signup". Probed 2026-08-29: chronosphere.io/pricing and
    /pricing/ both return 404, no pricing link exists in the navigation or footer, and the only commercial call
    to action is https://chronosphere.io/demo-request/ ("Request a Demo"). There is no self-serve signup, no published
    free tier and no trial; API access requires an existing tenant, which is why the API base is a per-customer
    subdomain. See plans/chronosphere-plans-pricing.yml.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/chronosphere.png
