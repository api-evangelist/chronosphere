aid: chronosphere
name: Chronosphere
description: 'Chronosphere is a cloud-native observability platform for controlling the cost and volume of telemetry
  data at scale, spanning metrics, logs, traces and change events. It ships an Observability Platform (dashboards,
  monitors, SLOs, differential diagnosis, PromQL querying and metrics shaping) and a Telemetry Pipeline built on
  Fluent Bit, acquired with Calyptia. Its APIs are per-tenant HTTP/JSON: a Config API for resources as code, a Data
  API for events, logs and traces, and a State API for usage and rule health, with Prometheus-compatible query endpoints,
  an open-source MCP server, a Terraform provider and the Chronoctl CLI. Palo Alto Networks completed its acquisition
  of Chronosphere in 2026.'
type: Index
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: false
  label: Hosted service · you call their endpoint
  confidence: medium
  source:
