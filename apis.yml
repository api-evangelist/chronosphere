x-pointer-check:
  date: '2026-08-29'
  method: manual curl with a browser User-Agent, following redirects, one attempt per URL
  result: every pointer emitted or retained in this file returned a live document
  removed:
  - type: HelpCenter
    url: https://support.chronosphere.io
    status: 403
    reason: Cloudflare interstitial ("Just a moment...") on an authenticated support portal; the shared pointer
      probe grades it soft-404, so it was not retained as a claim.
  not_emitted:
  - type: SignUp
    url: https://chronosphere.io/demo-request/
    status: 200
    reason: The page is live but it is a "Request a Demo" sales form, not a self-serve signup. Emitting SignUp for
      it would assert an onboarding path Chronosphere does not offer, and it made the derived accessModel read "self-serve".
  - type: Pricing
    url: https://chronosphere.io/pricing
    status: 404
    reason: Chronosphere publishes no pricing page.
  - type: TermsOfService
    status: 404
    reason: No terms page found on chronosphere.io; /terms/, /terms-of-service/, /terms-of-use/, /terms-and-conditions/
      and /legal/ all 404 and the footer links none.
  - type: Postman
    url: https://www.postman.com/chronosphere
    status: 200
    reason: 'Soft-200: the page returns the Postman shell with no Chronosphere content, and a nonsense-workspace
      control returns the same 200. No public collection exists.'
  - type: Security
    reason: No vulnerability disclosure program, security.txt or bug bounty found. /.well-known/security.txt returns
      404 on chronosphere.io and docs.chronosphere.io; the security overview page describes internal scanning and
      pen testing but names no reporting channel.
  - type: Deprecation
    reason: No deprecation policy is published, and no Sunset or Deprecation headers are documented.
  - type: Roadmap
    reason: No public roadmap.
  - type: SecurityTxt
    reason: 404 on every probed host.
  - type: AsyncAPI
    reason: No AsyncAPI document published; the webhook surface is catalogued under type Webhooks instead.
  - type: Protobuf
    reason: The APIs are grpc-gateway generated but no .proto is published in the 84 public repos of the chronosphereio
      organization.
  - type: WSDL
    reason: No SOAP surface; ?wsdl and ?singleWsdl return the ordinary HTML page.
  - type: Sandbox
    reason: No sandbox, test mode or free trial is published.
x-enrichment:
  date: '2026-08-29'
  status: enriched
  artifacts_added: 64
  pass: local-v1
