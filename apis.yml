aid: chronosphere
name: Chronosphere
description: 'Chronosphere is a cloud-native observability platform for controlling the cost and volume of telemetry
  data at scale, spanning metrics, logs, traces and change events. It ships an Observability Platform (dashboards,
  monitors, SLOs, differential diagnosis, PromQL querying and metrics shaping) and a Telemetry Pipeline built on
  Fluent Bit, acquired with Calyptia. Its APIs are per-tenant HTTP/JSON: a Config API for resources as code, a Data
  API for events, logs and traces, and a State API for usage and rule health, with Prometheus-compatible query endpoints,
  an open-source MCP server, a Terraform provider and the Chronoctl CLI. Palo Alto Networks completed its acquisition
  of Chronosphere in 2026.'
type: Index
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: false
  label: Hosted service · you call their endpoint
  confidence: medium
  source:
  - openapi
  - pricing
  generated: '2026-08-29'
  method: derived
accessModel:
  pricing: enterprise
  onboarding: sales-gated
  trial: false
  try_now: false
  public: false
  label: Enterprise · Sales-gated onboarding
  confidence: high
  source:
  - plans
  generated: '2026-08-29'
  method: searched
  note: 'Corrects a derived value of "Paid · Self-serve signup". Probed 2026-08-29: chronosphere.io/pricing and
    /pricing/ both return 404, no pricing link exists in the navigation or footer, and the only commercial call
    to action is https://chronosphere.io/demo-request/ ("Request a Demo"). There is no self-serve signup, no published
    free tier and no trial; API access requires an existing tenant, which is why the API base is a per-customer
    subdomain. See plans/chronosphere-plans-pricing.yml.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/chronosphere.png
x-docs-platform: mintlify
