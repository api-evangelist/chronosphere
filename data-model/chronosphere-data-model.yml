hubs:
- entity: Bucket
  inbound_references: 6
  note: >-
    Bucket and Collection are the two scoping hubs. Almost every alerting, shaping and dashboard
    resource hangs off one or the other, and several require exactly one of the pair — a
    constraint expressed only in prose descriptions, never as a JSON Schema oneOf, so a generated
    client will not enforce it.
- entity: NotificationPolicy
  inbound_references: 6
  note: >-
    The single fan-in point for alert routing. Bucket, Collection, Service, Monitor, SLO and
    ConsumptionBudget all point at it, and it in turn resolves to Notifiers.
- entity: Team
  inbound_references: 4
  note: Ownership root. Bucket, Collection, Service and NotificationPolicy attribute to a team.
referential_integrity:
  enforced: true
  evidence: >-
    Delete operations return 400 with "Cannot delete the <Resource> because it is in use", so the
    graph is enforced server-side rather than left to the caller.
  implication: >-
    Teardown must be ordered leaf-first. There is no cascade parameter and no dependency listing
    operation, so an agent deleting a Bucket has to discover its dependants by listing every
    resource type that can reference one.
