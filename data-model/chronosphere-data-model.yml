identity:
  scheme: slug
  description: >-
    Every addressable Config resource is identified by a `slug` — max 255 characters, letters,
    numbers, underscores and dashes, case-sensitive. Slugs are server-generated when not supplied
    and are the join key for every relationship in this model. There are no opaque numeric ids and
    no type-prefixed ids.
