source: >-
  Derived by binding the 39 tools in the Chronosphere MCP server's published "Available Tools"
  table (https://github.com/chronosphereio/chronosphere-mcp) to operationIds in the provider's own
  published OpenAPI documents: Config V1 (183 operations), Data V1 (9), State V1 (3) and State
  Unstable (2), all fetched from https://docs.chronosphere.io/openapi/ on 2026-08-29.
provider: Chronosphere
providerId: chronosphere
confidence_note: >-
  The hosted MCP endpoint is per-tenant and authenticated, so no live tools/list with inputSchema
  could be obtained. Bindings are made by name and by resource semantics against real operationIds
  that were grepped out of the specs. Where a tool has an exact one-to-one resource counterpart the
  confidence is high; where the tool wraps a query surface that has no public REST operation it is
  recorded in mcp_only[] rather than guessed at.
