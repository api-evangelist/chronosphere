mcp_only:
- tool: get_events_metadata
  reason: >-
    No public REST operation. The Data V1 events surface exposes list and create, not a metadata
    or queryable-properties endpoint.
- tool: list_events_label_values
  reason: No public REST operation for event label values in Data V1 or Data Unstable.
- tool: get_log
  reason: >-
    Data V1 publishes logs:range only; fetching a single log message by ID has no published REST
    operation.
- tool: get_log_histogram
  reason: No published REST operation; the histogram is computed over the log query surface.
- tool: list_log_field_names
  reason: No published REST operation for log field-name discovery.
- tool: list_log_field_values
  reason: No published REST operation for log field-value discovery.
- tool: list_prometheus_label_names
  reason: >-
    Backed by the Prometheus HTTP API that Chronosphere exposes at
    /data/metrics/api/v1/* (documented at /tooling/prometheus-api), not by the Config/Data/State
    OpenAPI documents. It is a standards-based surface with no first-party OpenAPI.
- tool: list_prometheus_label_values
  reason: Prometheus HTTP API surface; no first-party OpenAPI operation.
- tool: list_prometheus_series
  reason: Prometheus HTTP API surface; no first-party OpenAPI operation.
- tool: list_prometheus_series_metadata
  reason: Prometheus HTTP API surface; no first-party OpenAPI operation.
- tool: query_prometheus_instant
  reason: Prometheus HTTP API /query; no first-party OpenAPI operation.
- tool: query_prometheus_range
  reason: >-
    Prometheus HTTP API /query_range plus Chronosphere PromQL custom functions; no first-party
    OpenAPI operation.
- tool: render_prometheus_range_query
  reason: >-
    Renders a PromQL range query as a PNG. Composite, agent-facing only; no REST counterpart.
rest_only:
  count: 171
  summary: >-
    The MCP server is deliberately read-oriented. Of the 183 Config V1 operations only the 18
    Read/List operations above are exposed as tools; all 38 Create, 37 Update and 38 Delete
    operations, plus every List/Read on the other 30 configured resource types, have no tool.
  notable_families_with_no_tool:
  - Create/Update/Delete on every Config V1 resource (113 write operations)
  - Bucket, Collection, Dataset, DerivedLabel, DerivedMetric, Service, ServiceAccount, Team
  - MutingRule, Notifier, ExternalConnection, SyntheticTest, CloudIntegration
  - ResourcePools, ConsumptionBudget, ConsumptionConfig, LogAllocationConfig, LogIngestConfig
  - TraceBehavior, TraceBehaviorConfig, TraceMetricsRule, TraceTailSamplingRules
  - TraceJaegerRemoteSamplingStrategy, OtelMetricsIngestion, GrafanaDashboard
  - Data V1 CreateEvent, ReadMetricMetadata and the whole PanelAnnotation family
coverage:
  mcp_tools: 38
  tools_bound_to_rest: 25
  tools_mcp_only: 13
  rest_operations_v1: 195
  rest_operations_with_a_tool: 24
  rest_operations_without_a_tool: 171
  bound_ratio_tools: 0.66
  bound_ratio_rest: 0.12
  note: >-
    38 is the count of rows in the provider's own Available Tools table (configapi 18, events 3,
    logs 5, metrics 7, metric_usage 3, monitors 1, traces 1). 24 of the 25 bound tools map into
    the v1 contracts; list_monitor_statuses maps into the State Unstable contract and so is
    excluded from rest_operations_with_a_tool.
note: >-
  The three tools on the documentation MCP server (search_chronosphere_documentation,
  query_docs_filesystem_chronosphere_documentation, submit_feedback) are a separate surface and
  are not crosswalked here. The headline finding is asymmetry: an agent can read nine
  Chronosphere resource types through MCP and write none of them, while the REST contract
  exposes 113 write operations, every one of which accepts dry_run.
