    url: https://docs.chronosphere.io/tooling/infrastructure/terraform/release-notes
  - name: Telemetry Pipeline release notes
    url: https://docs.chronosphere.io/ingest/pipeline/v2/release-notes
  gated:
  - name: Observability Platform release notes
    location: in-app, More information > Release Notes
  - name: Chronoctl release notes
    location: in-app, More information > Release Notes > Chronoctl tab
  details: changelog/chronosphere-changelog.yml
findings:
- >-
  Chronosphere runs a versioned API with a clean stable/unstable split and a published 99.9% SLA,
  but ships no deprecation policy, no Sunset headers, no API changelog and a status page behind
  SSO. Everything an operator needs to plan a migration is either in a Terraform changelog or
  behind the sign-in.
