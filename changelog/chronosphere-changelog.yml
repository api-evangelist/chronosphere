- surface: Config V1 / Data V1 / State V1 HTTP APIs
  finding: >-
    No public, dated changelog. API change has to be inferred from the Terraform provider notes or
    by diffing the published Swagger, which is what this repo now does — the 2026-08-29 harvest of
